<a href="{{ gameLink }}" class="card__container">
  <img class="card__img" src="{{ gameCover }}" />
  <app-card-label gameLabel="{{ gameLabel }}"></app-card-label>
  <app-card-pricing
    gamePrice="{{ gamePrice }}"
    gameType="{{ gameType }}"
    gameName="{{ gameName }}"
  ></app-card-pricing>
</a>
